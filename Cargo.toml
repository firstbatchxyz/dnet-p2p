[package]
name = "dnet-p2p"
version = "0.1.2"
description = "dnet LAN peer discovery"
edition = "2021"
license = "APACHE-2.0"
authors = ["erhant <erhan@dria.co>"]

[lib]
crate-type = [
  "cdylib", # allows C/C++ to use this library
  "rlib",   # allows Rust to use this library
]

[dependencies]
# cli
clap = { version = "4.5.32", features = ["derive"] }

# logging & errors
env_logger = "0.11.7"
log = "0.4.26"
eyre = "0.6.12"

# async
tokio = { version = "1.38", default-features = false, features = ["full"] }
tokio-util = { version = "0.7" }
futures = "0.3.30"

# networking
local-ip-address = "0.6.5"
socket2 = "0.6"
socket-pktinfo = "0.3.2"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
