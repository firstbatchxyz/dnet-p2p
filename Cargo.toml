[package]
name = "dllmd"
version = "0.0.1"
edition = "2021"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
env_logger = "0.11.7"
gethostname = "1.0.0"
log = "0.4.26"
mdns-sd = "0.13.3"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "process",
  "time",
] }
