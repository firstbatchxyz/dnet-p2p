[package]
name = "dllmd"
version = "0.0.1"
edition = "2021"
authors = ["erhant"]

[lib]
crate-type = [
  "cdylib", # allows C/C++ to use this library
  "rlib",   # allows main.rs to use this library
]

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
env_logger = "0.11.7"
log = "0.4.26"
futures = "0.3.30"

tokio = { version = "1.38", default-features = false, features = ["full"] }
tokio-util = { version = "0.7" }

libp2p = { version = "0.55.0", features = [
  "tokio",
  "gossipsub",
  "mdns",
  "noise",
  "macros",
  "tcp",
  "yamux",
] }
