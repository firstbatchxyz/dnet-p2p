[package]
name = "dnet-p2p"
version = "0.0.1"
edition = "2021"
authors = ["erhant"]

[lib]
crate-type = [
  "cdylib", # allows C/C++ to use this library
  "rlib",   # allows Rust to use this library
]

[dependencies]
# cli
clap = { version = "4.5.32", features = ["derive"] }

# logging & errors
env_logger = "0.11.7"
log = "0.4.26"
eyre = "0.6.12"

# async
tokio = { version = "1.38", default-features = false, features = ["full"] }
tokio-util = { version = "0.7" }
futures = "0.3.30"

# service discovery
mdns-sd = "0.13.6"

# system info
sysinfo = "0.33.1"
gethostname = "1.0.2"

# serialization
serde = { version = "1.0", features = [
  "derive",
] } # FIXME: may remove if repr(C) works
serde_json = "1.0" # FIXME: may remove if repr(C) works
